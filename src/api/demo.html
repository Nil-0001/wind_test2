<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wind Stowage Console</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/demo.css">
  <script type="module" src="/static/demo.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div>
        <h1>Wind Stowage Console</h1>
        <p>智能风电配载控制台</p>
      </div>
      <div class="header-actions">
        <span id="statusBadge" class="badge status-idle">Idle</span>
        <button id="themeBtn" class="btn ghost">深色</button>
      </div>
    </header>
    <main class="main">
      <aside class="card sidebar">
        <section>
          <h3>默认参数（Standard）</h3>
          <div class="form-grid">
            <label>solver_name<input id="solverName" type="text"></label>
            <label>time_limit_s<input id="timeLimit" type="number" min="10"></label>
            <label>x_gap<input id="xGap" type="number" min="0"></label>
            <label>y_gap<input id="yGap" type="number" min="0"></label>
            <label>L1 x<input id="l1x" type="number" min="1"></label>
            <label>L1 y<input id="l1y" type="number" min="1"></label>
            <label>L23 x<input id="l23x" type="number" min="1"></label>
            <label>L23 y<input id="l23y" type="number" min="1"></label>
            <label>L4 x<input id="l4x" type="number" min="1"></label>
            <label>L4 y<input id="l4y" type="number" min="1"></label>
          </div>
        </section>
        <section>
          <h3>输入数据</h3>
          <textarea id="rawInput" placeholder="输入船舶及货物数据"></textarea>
          <div id="sampleStatus" class="hint">输入区为空，点击加载样例或提供数据</div>
          <div class="row">
            <button id="sampleBtn" class="btn ghost">加载样例</button>
            <button id="solveBtn" class="btn primary">开始求解</button>
          </div>
          <div class="row">
            <button id="cadBtn" class="btn success" disabled>下载 CAD</button>
            <button id="jsonBtn" class="btn ghost" disabled>下载 JSON</button>
          </div>
        </section>
      </aside>
      <section class="content">
        <div class="card progress-card">
          <div class="row spread small">
            <span id="phaseLabel">idle · 0%</span>
            <span id="elapsedLabel"></span>
          </div>
          <div class="progress-track"><div id="progressBar"></div></div>
          <p id="progressMsg">等待开始</p>
          <p id="progressHint" class="hint">等待任务提交</p>
        </div>
        <div class="card">
          <div class="row spread"><h3>实时日志</h3><span id="logCount" class="small">0 lines</span></div>
          <button id="followBtn" class="btn ghost hidden">回到底部</button>
          <div id="logPanel" class="term"></div>
        </div>
        <div class="card">
          <div class="row tabs">
            <button class="tab active" data-tab="stats">Stats</button>
            <button class="tab" data-tab="2d">2D</button>
            <button class="tab" data-tab="3d">3D</button>
            <button class="tab" data-tab="json">JSON</button>
            <div class="tabs-actions">
              <button id="open2dBtn" class="btn ghost" disabled>打开2D视图</button>
              <button id="open3dBtn" class="btn ghost" disabled>打开3D视图</button>
            </div>
          </div>
          <div id="statsView" class="stats-grid"></div>
          <div id="viewer2dWrap" class="viewer-wrap hidden">
            <iframe id="frame2d" class="frame"></iframe>
          </div>
          <div id="viewer3dWrap" class="viewer-wrap hidden">
            <iframe id="frame3d" class="frame"></iframe>
          </div>
          <pre id="jsonView" class="json hidden">暂无结果</pre>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
